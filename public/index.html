<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #sohbet-alani { width: 100%; max-width: 600px; background-color: rgba(10, 10, 10, 0.9); border: 1px solid #0f0; border-radius: 10px; padding: 20px; box-shadow: 0 0 20px #0f0; display: none; flex-direction: column; height: 80vh; }
        #mesajlar { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding-right: 10px; word-wrap: break-word; }
        .mesaj { margin-bottom: 10px; }
        .ben { color: #0f0; text-align: right; }
        .karsi { color: #ff0055; text-align: left; }
        .sistem-uyari { color: #ff0000; text-align: center; font-weight: bold; background-color: rgba(255, 0, 0, 0.1); padding: 5px; border: 1px dashed #ff0000; border-radius: 5px; }
        .tehdit-uyari { color: #ff9900; text-align: left; background-color: rgba(255, 153, 0, 0.1); padding: 15px; border: 1px solid #ff9900; border-radius: 5px; margin-bottom: 10px; font-size: 13px; font-family: monospace;}
        .medya-gorsel { max-width: 80%; border-radius: 8px; margin-top: 5px; border: 1px solid #333; }
        #girdi-alani { display: flex; gap: 10px; }
        #mesaj-kutusu { flex-grow: 1; background-color: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; outline: none; border-radius: 5px; }
        button { background-color: #0f0; color: #000; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        #dosya-butonu { background-color: #444; color: white; }
        #bekleme-ekrani { text-align: center; font-size: 20px; animation: yanipSonme 1.5s infinite; }
        @keyframes yanipSonme { 50% { opacity: 0.3; } }
        #durum-bilgisi { font-size: 12px; color: #888; margin-bottom: 10px; text-align: center; height: 15px; font-weight: bold; }
        #esc-uyari { position: absolute; top: 10px; left: 10px; font-size: 12px; color: gray; }
        * { user-select: none; -webkit-user-select: none; -ms-user-select: none; }
        input { user-select: auto; -webkit-user-select: auto; }
    </style>
</head>
<body>

    <div id="esc-uyari">Panik Butonu: ESC</div>
    <div id="bekleme-ekrani">Bağlantı Kuruluyor...</div>

    <div id="sohbet-alani">
        <div id="durum-bilgisi">Uçtan Uca Şifreli Bağlantı (E2EE) Aktif 🔒</div>
        <div id="mesajlar"></div>
        <div id="girdi-alani">
            <input type="file" id="dosya-secici" accept="image/*" style="display: none;">
            <button id="dosya-butonu" onclick="document.getElementById('dosya-secici').click()">📎</button>
            <input type="text" id="mesaj-kutusu" placeholder="Şifrelenmiş mesajını yaz..." autocomplete="off">
            <button onclick="mesajGonder()">GÖNDER</button>
        </div>
    </div>

    <script>
        // 1. KOD KORUMA VE ANTI-DEBUGGER
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                socket.emit('durum-degisti', 'gelistirici-konsolu-ihlali');
            }
        });

        let kalkanAktif = true;
        setInterval(() => {
            const baslangic = performance.now();
            debugger;
            const bitis = performance.now();
            if (bitis - baslangic > 100 && kalkanAktif) {
                kalkanAktif = false;
                document.body.innerHTML = `<div style="text-align:center; color:red; margin-top:20%;"><h1>🚨 SİSTEM İMHA EDİLDİ 🚨</h1><p>Geliştirici Konsolu tespit edildi.</p></div>`;
                socket.emit('durum-degisti', 'gelistirici-konsolu-ihlali');
                socket.disconnect();
            }
        }, 1000);

        // 2. SOHBET VE ŞİFRELEME ALTYAPISI
        const socket = io();
        const roomId = window.location.pathname.split('/').pop();
        const GIZLI_ANAHTAR = roomId; 

        const beklemeEkrani = document.getElementById('bekleme-ekrani');
        const sohbetAlani = document.getElementById('sohbet-alani');
        const mesajlar = document.getElementById('mesajlar');
        const mesajKutusu = document.getElementById('mesaj-kutusu');
        const durumBilgisi = document.getElementById('durum-bilgisi');
        const dosyaSecici = document.getElementById('dosya-secici');

        socket.emit('odaya-katil', roomId);

        socket.on('katilim-durumu', (data) => { beklemeEkrani.innerText = "Davetiyenin tıklanması bekleniyor..."; });
        socket.on('sohbet-basladi', () => { beklemeEkrani.style.display = 'none'; sohbetAlani.style.display = 'flex'; });
        socket.on('imha-edildi', (sebep) => { document.body.innerHTML = `<div style="text-align:center; color:red; margin-top:20%;"><h1>SİSTEM İMHA EDİLDİ</h1><p>${sebep}</p></div>`; socket.disconnect(); });

        function mesajGonder() {
            const mesaj = mesajKutusu.value.trim();
            if (mesaj) {
                ekranaYazdir('Sen', mesaj, 'ben');
                const sifreliMesaj = CryptoJS.AES.encrypt(mesaj, GIZLI_ANAHTAR).toString();
                socket.emit('mesaj-gonder', sifreliMesaj);
                mesajKutusu.value = '';
            }
        }

        socket.on('mesaj-al', (sifreliMesaj) => {
            try {
                const cozulenByte = CryptoJS.AES.decrypt(sifreliMesaj, GIZLI_ANAHTAR);
                const orjinalMesaj = cozulenByte.toString(CryptoJS.enc.Utf8);
                ekranaYazdir('Ajan', orjinalMesaj, 'karsi');
            } catch (e) { console.error("Şifre çözülemedi!"); }
        });

        // 3. HAYALET MEDYA (EXIF SİLİCİ)
        dosyaSecici.addEventListener('change', function(e) {
            const dosya = e.target.files[0];
            if (!dosya) return;
            if (dosya.size > 5 * 1024 * 1024) { alert("Fotoğraf çok büyük (Max 5MB)."); return; }
            
            const okuyucu = new FileReader();
            okuyucu.onload = function(olay) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    const exifsizFoto = canvas.toDataURL('image/jpeg', 0.8); 
                    fotoYazdir('Sen', exifsizFoto, 'ben');
                    const sifreliFoto = CryptoJS.AES.encrypt(exifsizFoto, GIZLI_ANAHTAR).toString();
                    socket.emit('medya-gonder', sifreliFoto);
                };
                img.src = olay.target.result;
            };
            okuyucu.readAsDataURL(dosya);
            dosyaSecici.value = '';
        });

        socket.on('medya-al', (sifreliFoto) => {
            try {
                const cozulenByte = CryptoJS.AES.decrypt(sifreliFoto, GIZLI_ANAHTAR);
                const orjinalFoto = cozulenByte.toString(CryptoJS.enc.Utf8);
                fotoYazdir('Ajan', orjinalFoto, 'karsi');
            } catch(e) { console.error("Fotoğraf şifresi çözülemedi!"); }
        });

        function ekranaYazdir(kisi, mesaj, cssSinifi) {
            const div = document.createElement('div');
            div.className = `mesaj ${cssSinifi}`;
            div.innerHTML = `<strong>${kisi}:</strong> ${mesaj}`;
            mesajlar.appendChild(div);
            mesajlar.scrollTop = mesajlar.scrollHeight;
        }

        function fotoYazdir(kisi, fotoBase64, cssSinifi) {
            const div = document.createElement('div');
            div.className = `mesaj ${cssSinifi}`;
            div.innerHTML = `<strong>${kisi}:</strong><br><img src="${fotoBase64}" class="medya-gorsel">`;
            mesajlar.appendChild(div);
            mesajlar.scrollTop = mesajlar.scrollHeight;
        }

        function sistemUyariYazdir(mesaj) {
            const div = document.createElement('div');
            div.className = `mesaj sistem-uyari`;
            div.innerHTML = `⚠️ ${mesaj}`;
            mesajlar.appendChild(div);
            mesajlar.scrollTop = mesajlar.scrollHeight;
        }

        socket.on('tehdit-algilandi', (bilgi) => {
            const div = document.createElement('div');
            div.className = `mesaj tehdit-uyari`;
            div.innerHTML = `<span style="color:red; font-size:15px;">🚨 SİSTEME YETKİSİZ SIZMA GİRİŞİMİ!</span><hr style="border-color:#ff9900; opacity:0.3;">
            <b>IP Adresi:</b> ${bilgi.ip}<br>
            <b>Konum:</b> ${bilgi.konum}<br>
            <b>İnternet Sağlayıcı:</b> ${bilgi.isp}<br>
            <b>Cihaz:</b> ${bilgi.cihaz}`;
            mesajlar.appendChild(div);
            mesajlar.scrollTop = mesajlar.scrollHeight;
        });

        mesajKutusu.addEventListener('keypress', (e) => { if (e.key === 'Enter') mesajGonder(); });

        let yaziyorZamanlayici;
        mesajKutusu.addEventListener('input', () => {
            socket.emit('yaziyor', true);
            clearTimeout(yaziyorZamanlayici);
            yaziyorZamanlayici = setTimeout(() => socket.emit('yaziyor', false), 1500);
        });

        socket.on('karsi-yaziyor', (durum) => {
            durumBilgisi.innerText = durum ? "Karşı taraf şifreli bir mesaj yazıyor..." : "Uçtan Uca Şifreli Bağlantı (E2EE) Aktif 🔒";
            durumBilgisi.style.color = durum ? "#0f0" : "#888";
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.body.style.display = 'none';
                socket.disconnect();
                window.location.href = "https://www.google.com";
            }
        });

        // 4. RADAR VE İHLAL TESPİT SİSTEMİ
        window.addEventListener('blur', () => { 
            socket.emit('durum-degisti', 'odak-kaybi'); 
        });

        socket.on('karsi-durum', (durum) => {
            if (durum === 'odak-kaybi') { sistemUyariYazdir("WRONG: Karşı taraf pencereyi terk etti / Ekran görüntüsü almaya çalışıyor olabilir!"); } 
            else if (durum === 'gelistirici-konsolu-ihlali') { sistemUyariYazdir("WRONG: Karşı taraf sistem kodlarını incelemeye (F12) çalıştı!"); }
        });
    </script>
</body>
</html>
