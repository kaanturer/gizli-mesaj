<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem</title>
    <script src="/socket.io/socket.io.js"></script>
    <!-- YENİ: ASKERİ DÜZEY ŞİFRELEME KÜTÜPHANESİ (CryptoJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #sohbet-alani {
            width: 100%;
            max-width: 600px;
            background-color: rgba(10, 10, 10, 0.9);
            border: 1px solid #0f0;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px #0f0;
            display: none;
            flex-direction: column;
            height: 80vh;
        }
        #mesajlar {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 10px;
            word-wrap: break-word;
        }
        .mesaj { margin-bottom: 10px; }
        .ben { color: #0f0; text-align: right; }
        .karsi { color: #ff0055; text-align: left; }
        .medya-gorsel {
            max-width: 80%;
            border-radius: 8px;
            margin-top: 5px;
            border: 1px solid #333;
        }
        #girdi-alani {
            display: flex;
            gap: 10px;
        }
        #mesaj-kutusu {
            flex-grow: 1;
            background-color: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px;
            outline: none;
            border-radius: 5px;
        }
        button {
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        #dosya-butonu {
            background-color: #444;
            color: white;
        }
        #bekleme-ekrani {
            text-align: center;
            font-size: 20px;
            animation: yanipSonme 1.5s infinite;
        }
        @keyframes yanipSonme {
            50% { opacity: 0.3; }
        }
        #durum-bilgisi {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            text-align: center;
            height: 15px;
        }
        .bulaniklilik {
            filter: blur(15px);
            pointer-events: none;
        }
        #esc-uyari {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>

    <div id="esc-uyari">Panik Butonu: ESC</div>
    <div id="bekleme-ekrani">Bağlantı Kuruluyor...</div>

    <div id="sohbet-alani">
        <div id="durum-bilgisi">Uçtan Uca Şifreli Bağlantı (E2EE) Aktif 🔒</div>
        <div id="mesajlar"></div>
        <div id="girdi-alani">
            <!-- YENİ: GİZLİ DOSYA SEÇİCİ -->
            <input type="file" id="dosya-secici" accept="image/*" style="display: none;">
            <button id="dosya-butonu" onclick="document.getElementById('dosya-secici').click()">📎</button>
            <input type="text" id="mesaj-kutusu" placeholder="Şifrelenmiş mesajını yaz..." autocomplete="off">
            <button onclick="mesajGonder()">GÖNDER</button>
        </div>
    </div>

    <script>
        const socket = io();
        const roomId = window.location.pathname.split('/').pop();
        
        // YENİ: ŞİFRELEME ANAHTARIMIZ (Odanın benzersiz ID'sini şifre anahtarı olarak kullanıyoruz)
        const GIZLI_ANAHTAR = roomId; 

        const beklemeEkrani = document.getElementById('bekleme-ekrani');
        const sohbetAlani = document.getElementById('sohbet-alani');
        const mesajlar = document.getElementById('mesajlar');
        const mesajKutusu = document.getElementById('mesaj-kutusu');
        const durumBilgisi = document.getElementById('durum-bilgisi');
        const dosyaSecici = document.getElementById('dosya-secici');

        socket.emit('odaya-katil', roomId);

        socket.on('katilim-durumu', (data) => {
            beklemeEkrani.innerText = "Davetiyenin (Linkin) tıklanması bekleniyor...";
        });

        socket.on('sohbet-basladi', () => {
            beklemeEkrani.style.display = 'none';
            sohbetAlani.style.display = 'flex';
        });

        socket.on('imha-edildi', (sebep) => {
            document.body.innerHTML = `<div style="text-align:center; color:red; margin-top:20%;"><h1>SİSTEM İMHA EDİLDİ</h1><p>${sebep}</p></div>`;
            socket.disconnect();
        });

        // MESAJ GÖNDERME VE ŞİFRELEME
        function mesajGonder() {
            const mesaj = mesajKutusu.value.trim();
            if (mesaj) {
                // Ekrana Şifresiz Halini Yazdır
                ekranaYazdir('Sen', mesaj, 'ben');
                
                // YENİ: Mesajı CryptoJS ile Şifrele ve Sunucuya Öyle Gönder
                const sifreliMesaj = CryptoJS.AES.encrypt(mesaj, GIZLI_ANAHTAR).toString();
                socket.emit('mesaj-gonder', sifreliMesaj);
                
                mesajKutusu.value = '';
            }
        }

        // MESAJ ALMA VE ŞİFRE ÇÖZME
        socket.on('mesaj-al', (sifreliMesaj) => {
            // YENİ: Sunucudan Gelen Harf Çorbasını Kendi Bilgisayarında Çöz
            try {
                const cozulenByte = CryptoJS.AES.decrypt(sifreliMesaj, GIZLI_ANAHTAR);
                const orjinalMesaj = cozulenByte.toString(CryptoJS.enc.Utf8);
                
                ekranaYazdir('Ajan', orjinalMesaj, 'karsi');
                durumBilgisi.innerText = "Uçtan Uca Şifreli Bağlantı (E2EE) Aktif 🔒";
            } catch (e) {
                console.error("Şifre çözülemedi!");
            }
        });

        // YENİ: FOTOĞRAF SEÇME VE ŞİFRELEYİP GÖNDERME
        dosyaSecici.addEventListener('change', function(e) {
            const dosya = e.target.files[0];
            if (!dosya) return;

            // Fotoğraf 5MB'dan büyükse uyar
            if (dosya.size > 5 * 1024 * 1024) {
                alert("Fotoğraf çok büyük. Lütfen 5 MB altı bir resim seçin.");
                return;
            }

            const okuyucu = new FileReader();
            okuyucu.onload = function(olay) {
                const base64Foto = olay.target.result; // Fotoğrafın metin hali
                
                // Kendi ekranında göster
                fotoYazdir('Sen', base64Foto, 'ben');

                // Fotoğrafı şifrele ve sunucuya gönder
                const sifreliFoto = CryptoJS.AES.encrypt(base64Foto, GIZLI_ANAHTAR).toString();
                socket.emit('medya-gonder', sifreliFoto);
            };
            okuyucu.readAsDataURL(dosya);
            
            // İnputu sıfırla ki aynı fotoğrafı bir daha seçebilesin
            dosyaSecici.value = '';
        });

        // YENİ: ŞİFRELİ FOTOĞRAF ALMA VE ÇÖZME
        socket.on('medya-al', (sifreliFoto) => {
            try {
                const cozulenByte = CryptoJS.AES.decrypt(sifreliFoto, GIZLI_ANAHTAR);
                const orjinalFoto = cozulenByte.toString(CryptoJS.enc.Utf8);
                fotoYazdir('Ajan', orjinalFoto, 'karsi');
            } catch(e) {
                console.error("Fotoğraf şifresi çözülemedi!");
            }
        });

        // YARDIMCI FONKSİYONLAR
        function ekranaYazdir(kisi, mesaj, cssSinifi) {
            const div = document.createElement('div');
            div.className = `mesaj ${cssSinifi}`;
            div.innerHTML = `<strong>${kisi}:</strong> ${mesaj}`;
            mesajlar.appendChild(div);
            mesajlar.scrollTop = mesajlar.scrollHeight;
        }

        function fotoYazdir(kisi, fotoBase64, cssSinifi) {
            const div = document.createElement('div');
            div.className = `mesaj ${cssSinifi}`;
            div.innerHTML = `<strong>${kisi}:</strong><br><img src="${fotoBase64}" class="medya-gorsel">`;
            mesajlar.appendChild(div);
            mesajlar.scrollTop = mesajlar.scrollHeight;
        }

        // Enter Tuşu
        mesajKutusu.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') mesajGonder();
        });

        // Yazıyor Animasyonu
        let yaziyorZamanlayici;
        mesajKutusu.addEventListener('input', () => {
            socket.emit('yaziyor', true);
            clearTimeout(yaziyorZamanlayici);
            yaziyorZamanlayici = setTimeout(() => socket.emit('yaziyor', false), 1500);
        });

        socket.on('karsi-yaziyor', (durum) => {
            durumBilgisi.innerText = durum ? "Karşı taraf şifreli bir mesaj yazıyor..." : "Uçtan Uca Şifreli Bağlantı (E2EE) Aktif 🔒";
        });

        // Panik Butonu
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.body.classList.add('bulaniklilik');
                socket.disconnect();
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 500);
            }
        });

        // Ekran Gizlendiğinde
        document.addEventListener('visibilitychange', () => {
            socket.emit('durum-degisti', document.hidden ? 'gizli' : 'aktif');
        });
    </script>
</body>
</html>
